<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Simple Website</title>
  <meta name="description" content="A clean responsive HTML website template">
  <style>
    /* --------- Reset & base --------- */
    :root{--accent:#0066ff;--bg:#f7f9fc;--card:#ffffff;--text:#0b2545}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;color:var(--text);background:var(--bg);}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}

    /* --------- Layout --------- */
    .container{max-width:1100px;margin:0 auto;padding:24px}

    header{background:linear-gradient(90deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));backdrop-filter:blur(6px);position:sticky;top:0;z-index:50}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
    .logo{font-weight:700;color:var(--accent)}
    nav ul{display:flex;gap:16px;list-style:none}
    .btn{background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;font-weight:600}

    /* Mobile nav toggle */
    .menu-btn{display:none;background:none;border:0;font-size:20px}
    @media(max-width:760px){
      nav ul{display:none;flex-direction:column;gap:10px;margin-top:12px}
      nav ul.open{display:flex;background:var(--card);padding:12px;border-radius:8px;box-shadow:0 6px 18px rgba(11,37,69,0.06)}
      .menu-btn{display:block}
    }

    /* Hero */
    .hero{display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:center;padding:48px 0}
    .hero h1{font-size:clamp(28px,4vw,44px);line-height:1.02;margin-bottom:12px}
    .hero p{color:#254067;opacity:0.9;margin-bottom:18px}
    .card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 8px 30px rgba(11,37,69,0.06)}
    @media(max-width:900px){.hero{grid-template-columns:1fr;}}

    /* Features */
    .features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:36px 0}
    .feature{background:var(--card);padding:18px;border-radius:12px;text-align:center}
    .feature h3{margin-top:12px;font-size:18px}
    @media(max-width:900px){.features{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.features{grid-template-columns:1fr}}

    /* Gallery */
    .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px 0}
    .gallery div{background:linear-gradient(180deg,#f0f6ff,#fff);height:110px;border-radius:8px}
    @media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}}

    /* Footer */
    footer{padding:28px 0;color:#314a66}

    /* Small helpers */
    .muted{color:#5b6d88;font-size:15px}
    .stack{display:flex;gap:12px;align-items:center}
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="stack">
        <div class="logo">MySite</div>
        <div class="muted" style="font-size:13px;margin-left:8px">— clean & responsive</div>
      </div>

      <nav>
        <button class="menu-btn" aria-expanded="false" aria-controls="main-nav" id="menuBtn">☰</button>
        <ul id="main-nav">
          <li><a href="#home">my_Home</a></li>
